name: Build 4everTube 2027 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate & Build 4everTube 2027 Pro
        run: |
          flutter create --org com.technology4ever --project-name forevertube2027 --platforms=android app_project
          cd app_project
          flutter pub add youtube_explode_dart:^2.5.3 http:^1.2.2 path_provider:^2.1.4 permission_handler:^11.3.1 url_launcher:^6.3.1 open_filex:^4.5.0
          
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:open_filex/open_filex.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: ForeverTubeMasterApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class ForeverTubeMasterApp extends StatefulWidget {
            const ForeverTubeMasterApp({super.key});

            @override
            State<ForeverTubeMasterApp> createState() => _ForeverTubeMasterAppState();
          }

          class _ForeverTubeMasterAppState extends State<ForeverTubeMasterApp> with SingleTickerProviderStateMixin, WidgetsBindingObserver {
            late TabController _tabController;
            final TextEditingController _urlController = TextEditingController();
            final YoutubeExplode _yt = YoutubeExplode();
            static const platformChannel = MethodChannel('com.technology4ever.forevertube2027/share');

            bool _isLoading = false;
            bool _isDownloading = false;
            double _downloadProgress = 0.0;
            String _statusText = "Link paste karein ya kisi bhi app se 'Share' karein";
            String _speedText = "";
            String _etaText = "";
            String _sizeText = "";

            List<FileSystemEntity> _downloadedFiles = [];

            final List<String> _extractorApis = [
              "https://api.cobalt.tools/api/json",
              "https://co.wuk.sh/api/json"
            ];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _tabController = TabController(length: 2, vsync: this);
              _checkShareIntent();
              _loadDownloadedFiles();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _checkShareIntent();
                _loadDownloadedFiles();
              }
            }

            Future<Directory?> _getDownloadFolder() async {
              if (Platform.isAndroid) {
                Directory generalDownloadDir = Directory('/storage/emulated/0/Download/4everTube');
                if (!await generalDownloadDir.exists()) {
                  await generalDownloadDir.create(recursive: true);
                }
                return generalDownloadDir;
              }
              return await getApplicationDocumentsDirectory();
            }

            Future<void> _loadDownloadedFiles() async {
              try {
                final dir = await _getDownloadFolder();
                if (dir != null && await dir.exists()) {
                  final files = dir.listSync().where((f) => !f.path.endsWith('.tmp')).toList();
                  files.sort((a, b) => b.statSync().modified.compareTo(a.statSync().modified));
                  setState(() {
                    _downloadedFiles = files;
                  });
                }
              } catch (_) {}
            }

            Future<void> _checkShareIntent() async {
              try {
                final String? sharedData = await platformChannel.invokeMethod('getSharedData');
                if (sharedData != null && sharedData.isNotEmpty) {
                  String? extracted = _extractUrlFromText(sharedData);
                  if (extracted != null) {
                    setState(() {
                      _urlController.text = extracted;
                    });
                    _fetchMedia();
                  }
                }
              } catch (e) {
                debugPrint("Share Intent error: $e");
              }
            }

            String? _extractUrlFromText(String text) {
              RegExp exp = RegExp(r'(https?://[^\s]+)');
              Iterable<Match> matches = exp.allMatches(text);
              for (Match match in matches) {
                return text.substring(match.start, match.end);
              }
              return text.contains("http") ? text : null;
            }

            String _detectPlatform(String url) {
              if (url.contains("youtube.com") || url.contains("youtu.be")) return "YouTube";
              if (url.contains("instagram.com")) return "Instagram";
              if (url.contains("facebook.com") || url.contains("fb.watch")) return "Facebook";
              if (url.contains("tiktok.com")) return "TikTok";
              return "Universal";
            }

            Future<bool> _requestPermissions() async {
              if (Platform.isAndroid) {
                if (await Permission.manageExternalStorage.request().isGranted) return true;
                if (await Permission.storage.request().isGranted) return true;
                Map<Permission, PermissionStatus> statuses = await [
                  Permission.videos,
                  Permission.audio,
                  Permission.photos,
                ].request();
                return statuses.values.any((s) => s.isGranted);
              }
              return true;
            }

            Future<void> _fetchMedia() async {
              final rawInput = _urlController.text.trim();
              final url = _extractUrlFromText(rawInput) ?? rawInput;

              if (url.isEmpty) {
                _showSnack("Pehle koi valid link paste karein!");
                return;
              }

              String platform = _detectPlatform(url);

              setState(() {
                _isLoading = true;
                _statusText = "[$platform] Link analyze ho raha hai...";
              });

              if (platform == "YouTube") {
                await _handleYouTube(url);
              } else {
                await _handleSocialMedia(url, platform);
              }
            }

            Future<void> _handleYouTube(String url) async {
              try {
                final video = await _yt.videos.get(url);
                final manifest = await _yt.videos.streamsClient.getManifest(video.id);

                setState(() {
                  _isLoading = false;
                  _statusText = "Formats analyze ho gaye! Quality select karein.";
                });

                _openYouTubeSheet(video, manifest);
              } catch (e) {
                await _handleSocialMedia(url, "YouTube (HQ Bypass)");
              }
            }

            Future<void> _handleSocialMedia(String url, String platform) async {
              bool success = false;
              for (String api in _extractorApis) {
                try {
                  final response = await http.post(
                    Uri.parse(api),
                    headers: {"Accept": "application/json", "Content-Type": "application/json"},
                    body: jsonEncode({
                      "url": url,
                      "vQuality": "max",
                      "filenamePattern": "classic"
                    }),
                  ).timeout(const Duration(seconds: 10));

                  if (response.statusCode == 200) {
                    final data = jsonDecode(response.body);
                    final downloadUrl = data['url'];

                    if (downloadUrl != null) {
                      success = true;
                      setState(() {
                        _isLoading = false;
                        _statusText = "Media link decode ho gaya!";
                      });
                      _openDirectDownloadSheet(platform, downloadUrl.toString());
                      break;
                    }
                  }
                } catch (_) {
                  continue;
                }
              }

              if (!success) {
                setState(() {
                  _isLoading = false;
                  _statusText = "Link load nahi ho saka. Dobara check karein.";
                });
                _showSnack("Error: Server busy ya video private hai.");
              }
            }

            Future<void> _startDownloadEngine({
              required String downloadUrl,
              required String fileName,
              Stream<List<int>>? customStream,
              int? totalBytesLength,
            }) async {
              Navigator.pop(context);
              await _requestPermissions();

              final dir = await _getDownloadFolder();
              if (dir == null) {
                _showSnack("Storage access nahi mili!");
                return;
              }

              final filePath = "${dir.path}/$fileName";
              final file = File(filePath);

              setState(() {
                _isDownloading = true;
                _downloadProgress = 0.001;
                _statusText = "Download shuru ho gaya...";
                _speedText = "Calculating...";
                _etaText = "Estimating time...";
              });

              try {
                var output = file.openWrite();
                int received = 0;
                int total = totalBytesLength ?? 0;

                Stream<List<int>> stream;

                if (customStream != null) {
                  stream = customStream;
                } else {
                  final request = http.Request('GET', Uri.parse(downloadUrl));
                  final response = await http.Client().send(request);
                  total = response.contentLength ?? totalBytesLength ?? 1;
                  stream = response.stream;
                }

                final stopwatch = Stopwatch()..start();
                int lastBytes = 0;
                int lastTime = 0;

                await for (final chunk in stream) {
                  received += chunk.length;
                  output.add(chunk);

                  int elapsed = stopwatch.elapsedMilliseconds;
                  if (elapsed - lastTime >= 500) {
                    double speedBytesPerSec = ((received - lastBytes) / ((elapsed - lastTime) / 1000));
                    double speedMB = speedBytesPerSec / (1024 * 1024);
                    int remainingBytes = total > received ? (total - received) : 0;
                    int etaSeconds = speedBytesPerSec > 0 ? (remainingBytes / speedBytesPerSec).round() : 0;

                    setState(() {
                      _downloadProgress = total > 0 ? (received / total) : 0.5;
                      _sizeText = "${(received / (1024 * 1024)).toStringAsFixed(1)} MB / ${(total / (1024 * 1024)).toStringAsFixed(1)} MB";
                      _speedText = "${speedMB.toStringAsFixed(2)} MB/s";
                      _etaText = etaSeconds > 60 ? "${(etaSeconds / 60).toStringAsFixed(0)}m ${etaSeconds % 60}s left" : "${etaSeconds}s left";
                      _statusText = "Downloading: ${(_downloadProgress * 100).toStringAsFixed(1)}%";
                    });

                    lastBytes = received;
                    lastTime = elapsed;
                  }
                }

                await output.flush();
                await output.close();
                stopwatch.stop();

                setState(() {
                  _isDownloading = false;
                  _downloadProgress = 0.0;
                  _statusText = "Download Mukammal! Saved in 4everTube";
                  _speedText = "";
                  _etaText = "";
                });

                _showSnack("Saved in: 4everTube Folder");
                _loadDownloadedFiles();
                _tabController.animateTo(1);
              } catch (e) {
                setState(() {
                  _isDownloading = false;
                  _downloadProgress = 0.0;
                  _statusText = "Download Error: $e";
                });
                _showSnack("Download fail ho gaya: $e");
              }
            }

            void _openYouTubeSheet(Video video, StreamManifest manifest) {
              final audioStreams = manifest.audioOnly.sortByBitrate();
              final allVideoStreams = manifest.video.sortByVideoQuality();

              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Container(
                    height: MediaQuery.of(context).size.height * 0.75,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            ClipRRect(
                              borderRadius: BorderRadius.circular(8),
                              child: Image.network(
                                video.thumbnails.lowResUrl,
                                width: 80,
                                height: 55,
                                fit: BoxFit.cover,
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    video.title,
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                                  ),
                                  const SizedBox(height: 4),
                                  Text("Duration: ${video.duration?.inMinutes ?? 0} mins",
                                      style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                ],
                              ),
                            ),
                          ],
                        ),
                        const Divider(color: Colors.white24, height: 25),
                        Expanded(
                          child: ListView(
                            children: [
                              const Text("🎬 Video Qualities (4K, 2K, 1080p, 720p)",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                              const SizedBox(height: 10),
                              ...allVideoStreams.map((v) {
                                final quality = v.videoQualityLabel;
                                final mb = (v.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                String badge = quality.contains("2160") ? "4K Ultra HD" : quality.contains("1440") ? "2K QHD" : quality.contains("1080") ? "FHD" : "HD";
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.video_file, color: Color(0xFFF59E0B)),
                                    title: Text("$quality ($badge)", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • Format: ${v.container.name.toUpperCase()}", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download, color: Color(0xFF10B981)),
                                    onTap: () {
                                      String safeTitle = video.title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
                                      if (safeTitle.length > 35) safeTitle = safeTitle.substring(0, 35);
                                      String fileName = "${safeTitle}_${quality}.${v.container.name}";
                                      var stream = _yt.videos.streamsClient.get(v);
                                      _startDownloadEngine(
                                        downloadUrl: v.url.toString(),
                                        fileName: fileName,
                                        customStream: stream,
                                        totalBytesLength: v.size.totalBytes,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),

                              const SizedBox(height: 16),
                              const Text("🎵 Audio & MP3 (High Bitrate)",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                              const SizedBox(height: 10),
                              ...audioStreams.map((a) {
                                final kbps = a.bitrate.kiloBitsPerSecond.round();
                                final mb = (a.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.music_note, color: Color(0xFF10B981)),
                                    title: Text("$kbps kbps Studio Audio", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • Audio/MP3", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download, color: Color(0xFF10B981)),
                                    onTap: () {
                                      String safeTitle = video.title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
                                      if (safeTitle.length > 35) safeTitle = safeTitle.substring(0, 35);
                                      String fileName = "${safeTitle}_${kbps}k.mp3";
                                      var stream = _yt.videos.streamsClient.get(a);
                                      _startDownloadEngine(
                                        downloadUrl: a.url.toString(),
                                        fileName: fileName,
                                        customStream: stream,
                                        totalBytesLength: a.size.totalBytes,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            void _openDirectDownloadSheet(String platform, String directUrl) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return Container(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text("$platform HD Media Detected",
                            style: const TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 16)),
                        const SizedBox(height: 6),
                        const Text("High resolution original video bina kisi watermark ke ready hai.",
                            style: TextStyle(color: Colors.white70, fontSize: 13)),
                        const SizedBox(height: 18),
                        Row(
                          children: [
                            Expanded(
                              child: ElevatedButton.icon(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFF59E0B),
                                  foregroundColor: Colors.black,
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                ),
                                onPressed: () {
                                  String fName = "${platform}_${DateTime.now().millisecondsSinceEpoch}.mp4";
                                  _startDownloadEngine(downloadUrl: directUrl, fileName: fName);
                                },
                                icon: const Icon(Icons.video_collection),
                                label: const Text("Download MP4 (Max HD)", style: TextStyle(fontWeight: FontWeight.bold)),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 10),
                      ],
                    ),
                  );
                },
              );
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _tabController.dispose();
              _yt.close();
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 0,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Text("4everTube 2027 Pro", style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 18)),
                      Text("4K Ultra HD & Downloads Manager", style: TextStyle(color: Colors.white54, fontSize: 11)),
                    ],
                  ),
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: const Color(0xFFF59E0B),
                    tabs: const [
                      Tab(icon: Icon(Icons.download), text: "Download"),
                      Tab(icon: Icon(Icons.folder), text: "Saved Files"),
                    ],
                  ),
                  actions: [
                    IconButton(
                      tooltip: "Helpline",
                      icon: const Icon(Icons.call, color: Color(0xFFF59E0B)),
                      onPressed: () => launchUrl(Uri.parse("tel:03133796625")),
                    )
                  ],
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    // Tab 1: Downloader Page
                    Padding(
                      padding: const EdgeInsets.all(16.0),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: BoxDecoration(
                              color: const Color(0xFF1E293B),
                              borderRadius: BorderRadius.circular(10),
                              border: Border.all(color: Colors.white12),
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: const [
                                Text("🔴 YouTube 4K", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("🟣 Instagram", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("🔵 Facebook", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("⚫ TikTok HD", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: _urlController,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              filled: true,
                              fillColor: const Color(0xFF1E293B),
                              hintText: "Link paste karein ya app se share karein...",
                              hintStyle: const TextStyle(color: Colors.white38, fontSize: 12),
                              suffixIcon: IconButton(
                                icon: const Icon(Icons.clear, color: Colors.white38),
                                onPressed: () => _urlController.clear(),
                              ),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                            ),
                          ),
                          const SizedBox(height: 12),
                          SizedBox(
                            width: double.infinity,
                            height: 48,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFF59E0B),
                                foregroundColor: Colors.black,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                              onPressed: (_isLoading || _isDownloading) ? null : () => _fetchMedia(),
                              icon: const Icon(Icons.search),
                              label: Text(_isLoading ? "Processing Link..." : "Analyze 4K / HD Qualities",
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                            ),
                          ),
                          const SizedBox(height: 20),

                          if (_isDownloading) ...[
                            Container(
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(
                                color: const Color(0xFF1E293B),
                                borderRadius: BorderRadius.circular(12),
                                border: Border.all(color: const Color(0xFFF59E0B).withOpacity(0.3)),
                              ),
                              child: Column(
                                children: [
                                  LinearProgressIndicator(
                                    value: _downloadProgress,
                                    color: const Color(0xFFF59E0B),
                                    backgroundColor: Colors.white12,
                                    minHeight: 8,
                                  ),
                                  const SizedBox(height: 10),
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Text(_sizeText, style: const TextStyle(color: Colors.white70, fontSize: 12)),
                                      Text(_speedText, style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold, fontSize: 12)),
                                    ],
                                  ),
                                  const SizedBox(height: 4),
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Text(_statusText, style: const TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 12)),
                                      Text(_etaText, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                                    ],
                                  ),
                                ],
                              ),
                            ),
                          ] else ...[
                            Text(_statusText, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70, fontSize: 13)),
                          ],

                          const Spacer(),
                          const Text("Developed by 4ever technology • 03133796625",
                              style: TextStyle(color: Colors.white38, fontSize: 11)),
                          const SizedBox(height: 8),
                        ],
                      ),
                    ),

                    // Tab 2: Saved Downloads Folder Page
                    RefreshIndicator(
                      onRefresh: _loadDownloadedFiles,
                      child: _downloadedFiles.isEmpty
                          ? const Center(
                              child: Text("Abhi tak koi file download nahi hui.", style: TextStyle(color: Colors.white38)),
                            )
                          : ListView.builder(
                              itemCount: _downloadedFiles.length,
                              itemBuilder: (context, index) {
                                final file = File(_downloadedFiles[index].path);
                                final name = file.path.split('/').last;
                                final sizeMB = (file.lengthSync() / (1024 * 1024)).toStringAsFixed(1);
                                final isVideo = name.endsWith('.mp4') || name.endsWith('.mkv') || name.endsWith('.webm');

                                return Card(
                                  color: const Color(0xFF1E293B),
                                  margin: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                                  child: ListTile(
                                    leading: Icon(
                                      isVideo ? Icons.video_file : Icons.audio_file,
                                      color: isVideo ? const Color(0xFFF59E0B) : const Color(0xFF10B981),
                                      size: 36,
                                    ),
                                    title: Text(name, maxLines: 1, overflow: TextOverflow.ellipsis,
                                        style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)),
                                    subtitle: Text("$sizeMB MB • Saved in 4everTube Folder",
                                        style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                    trailing: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        IconButton(
                                          icon: const Icon(Icons.play_arrow, color: Color(0xFF10B981)),
                                          onPressed: () => OpenFilex.open(file.path),
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.delete, color: Colors.redAccent),
                                          onPressed: () {
                                            file.deleteSync();
                                            _loadDownloadedFiles();
                                            _showSnack("File delete ho gayi");
                                          },
                                        ),
                                      ],
                                    ),
                                    onTap: () => OpenFilex.open(file.path),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.technology4ever.forevertube2027">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>

              <application
                  android:label="4everTube 2027"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4everTube_2027_Release_APK
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
