name: Build 4everTube 2027 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate & Build 4everTube 2027
        run: |
          flutter create --org com.technology4ever --project-name forevertube2027 --platforms=android app_project
          cd app_project
          flutter pub add youtube_explode_dart:^2.5.3 http:^1.2.2 path_provider:^2.1.4 permission_handler:^11.3.1 url_launcher:^6.3.1
          
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: ForeverTubeMasterApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class ForeverTubeMasterApp extends StatefulWidget {
            const ForeverTubeMasterApp({super.key});

            @override
            State<ForeverTubeMasterApp> createState() => _ForeverTubeMasterAppState();
          }

          class _ForeverTubeMasterAppState extends State<ForeverTubeMasterApp> with WidgetsBindingObserver {
            final TextEditingController _urlController = TextEditingController();
            final YoutubeExplode _yt = YoutubeExplode();
            static const platformChannel = MethodChannel('com.technology4ever.forevertube2027/share');

            bool _isLoading = false;
            double _downloadProgress = 0.0;
            String _statusText = "Link paste karein ya kisi bhi app se 'Share' karein";

            final List<String> _extractorApis = [
              "https://api.cobalt.tools/api/json",
              "https://co.wuk.sh/api/json"
            ];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _checkShareIntent();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _checkShareIntent();
              }
            }

            Future<void> _checkShareIntent() async {
              try {
                final String? sharedData = await platformChannel.invokeMethod('getSharedData');
                if (sharedData != null && sharedData.isNotEmpty) {
                  String? extracted = _extractUrlFromText(sharedData);
                  if (extracted != null) {
                    setState(() {
                      _urlController.text = extracted;
                    });
                    _fetchMedia();
                  }
                }
              } catch (e) {
                debugPrint("Share Intent error: $e");
              }
            }

            String? _extractUrlFromText(String text) {
              RegExp exp = RegExp(r'(https?://[^\s]+)');
              Iterable<Match> matches = exp.allMatches(text);
              for (Match match in matches) {
                return text.substring(match.start, match.end);
              }
              return text.contains("http") ? text : null;
            }

            String _detectPlatform(String url) {
              if (url.contains("youtube.com") || url.contains("youtu.be")) return "YouTube";
              if (url.contains("instagram.com")) return "Instagram";
              if (url.contains("facebook.com") || url.contains("fb.watch")) return "Facebook";
              if (url.contains("tiktok.com")) return "TikTok";
              return "Universal";
            }

            Future<void> _fetchMedia() async {
              final rawInput = _urlController.text.trim();
              final url = _extractUrlFromText(rawInput) ?? rawInput;

              if (url.isEmpty) {
                _showSnack("Pehle koi valid link paste karein!");
                return;
              }

              String platform = _detectPlatform(url);

              setState(() {
                _isLoading = true;
                _statusText = "[$platform] Link analyze ho raha hai...";
              });

              if (platform == "YouTube") {
                await _handleYouTube(url);
              } else {
                await _handleSocialMedia(url, platform);
              }
            }

            Future<void> _handleYouTube(String url) async {
              try {
                final video = await _yt.videos.get(url);
                final manifest = await _yt.videos.streamsClient.getManifest(video.id);

                setState(() {
                  _isLoading = false;
                  _statusText = "Video ready! Format select karein.";
                });

                _openYouTubeSheet(video, manifest);
              } catch (e) {
                await _handleSocialMedia(url, "YouTube (HQ Bypass)");
              }
            }

            Future<void> _handleSocialMedia(String url, String platform) async {
              bool success = false;

              for (String api in _extractorApis) {
                try {
                  final response = await http.post(
                    Uri.parse(api),
                    headers: {
                      "Accept": "application/json",
                      "Content-Type": "application/json"
                    },
                    body: jsonEncode({
                      "url": url,
                      "vQuality": "1080",
                      "filenamePattern": "classic"
                    }),
                  ).timeout(const Duration(seconds: 8));

                  if (response.statusCode == 200) {
                    final data = jsonDecode(response.body);
                    final downloadUrl = data['url'];

                    if (downloadUrl != null) {
                      success = true;
                      setState(() {
                        _isLoading = false;
                        _statusText = "Direct stream ready!";
                      });

                      _openDirectDownloadSheet(platform, downloadUrl.toString());
                      break;
                    }
                  }
                } catch (_) {
                  continue;
                }
              }

              if (!success) {
                setState(() {
                  _isLoading = false;
                  _statusText = "Link analyze nahi ho saka. Top right sync dabayein.";
                });
                _showSnack("Server busy. Tap sync button.");
              }
            }

            Future<void> _downloadDirectFile(String url, String platform, String ext) async {
              Navigator.pop(context);

              if (Platform.isAndroid) {
                var status = await Permission.storage.request();
                if (!status.isGranted) {
                  await Permission.manageExternalStorage.request();
                }
              }

              setState(() {
                _downloadProgress = 0.001;
                _statusText = "Downloading $platform media...";
              });

              try {
                Directory? dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) {
                  dir = await getExternalStorageDirectory();
                }

                String filename = "${platform}_4ever_${DateTime.now().millisecondsSinceEpoch}.$ext";
                String savePath = "${dir!.path}/$filename";
                File file = File(savePath);

                final request = http.Request('GET', Uri.parse(url));
                final response = await http.Client().send(request);

                int total = response.contentLength ?? 1;
                int received = 0;
                List<int> bytes = [];

                response.stream.listen((List<int> chunk) {
                  bytes.addAll(chunk);
                  received += chunk.length;
                  setState(() {
                    _downloadProgress = received / total;
                    _statusText = "Downloading: ${(_downloadProgress * 100).toStringAsFixed(1)}% (${(received / (1024 * 1024)).toStringAsFixed(1)}MB)";
                  });
                }, onDone: () async {
                  await file.writeAsBytes(bytes);
                  setState(() {
                    _downloadProgress = 0.0;
                    _statusText = "Complete! Saved in Downloads";
                  });
                  _showSnack("Saved: $savePath");
                }, onError: (e) {
                  setState(() {
                    _downloadProgress = 0.0;
                    _statusText = "Download Error: $e";
                  });
                });
              } catch (e) {
                setState(() {
                  _downloadProgress = 0.0;
                  _statusText = "Error: $e";
                });
              }
            }

            Future<void> _startYouTubeDownload(Video video, StreamInfo streamInfo, String ext) async {
              Navigator.pop(context);

              if (Platform.isAndroid) {
                var status = await Permission.storage.request();
                if (!status.isGranted) {
                  await Permission.manageExternalStorage.request();
                }
              }

              setState(() {
                _downloadProgress = 0.001;
                _statusText = "Downloading started...";
              });

              try {
                Directory? dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) {
                  dir = await getExternalStorageDirectory();
                }

                String safeTitle = video.title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
                if (safeTitle.length > 40) safeTitle = safeTitle.substring(0, 40);

                String filePath = "${dir!.path}/${safeTitle}_4ever.$ext";
                File file = File(filePath);

                var stream = _yt.videos.streamsClient.get(streamInfo);
                var output = file.openWrite();

                int total = streamInfo.size.totalBytes;
                int received = 0;

                await for (final chunk in stream) {
                  received += chunk.length;
                  output.add(chunk);
                  setState(() {
                    _downloadProgress = received / total;
                    _statusText = "Downloading: ${(_downloadProgress * 100).toStringAsFixed(1)}% (${(received / (1024 * 1024)).toStringAsFixed(1)}MB / ${(total / (1024 * 1024)).toStringAsFixed(1)}MB)";
                  });
                }

                await output.flush();
                await output.close();

                setState(() {
                  _downloadProgress = 0.0;
                  _statusText = "Saved in Downloads folder!";
                });
                _showSnack("File Saved: $filePath");
              } catch (e) {
                setState(() {
                  _downloadProgress = 0.0;
                  _statusText = "Download error: $e";
                });
              }
            }

            void _openYouTubeSheet(Video video, StreamManifest manifest) {
              final audioStreams = manifest.audioOnly.sortByBitrate();
              final videoStreams = manifest.muxed.sortByVideoQuality();

              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Container(
                    padding: const EdgeInsets.all(16),
                    child: SingleChildScrollView(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              ClipRRect(
                                borderRadius: BorderRadius.circular(8),
                                child: Image.network(
                                  video.thumbnails.lowResUrl,
                                  width: 70,
                                  height: 50,
                                  fit: BoxFit.cover,
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: Text(
                                  video.title,
                                  maxLines: 2,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                                ),
                              ),
                            ],
                          ),
                          const Divider(color: Colors.white24, height: 25),
                          const Text("🎵 Music (MP3 / Audio)",
                              style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                          const SizedBox(height: 10),
                          Wrap(
                            spacing: 10,
                            runSpacing: 10,
                            children: audioStreams.map((audio) {
                              final mb = (audio.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                              return ActionChip(
                                backgroundColor: const Color(0xFF0F172A),
                                label: Text("${audio.bitrate.kiloBitsPerSecond.round()} kbps ($mb MB)",
                                    style: const TextStyle(color: Colors.white, fontSize: 12)),
                                onPressed: () => _startYouTubeDownload(video, audio, "mp3"),
                              );
                            }).toList(),
                          ),
                          const SizedBox(height: 20),
                          const Text("🎬 Video Formats (MP4)",
                              style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                          const SizedBox(height: 10),
                          Wrap(
                            spacing: 10,
                            runSpacing: 10,
                            children: videoStreams.map((v) {
                              final mb = (v.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                              return ActionChip(
                                backgroundColor: const Color(0xFF0F172A),
                                label: Text("${v.videoQualityLabel} ($mb MB)",
                                    style: const TextStyle(color: Colors.white, fontSize: 12)),
                                onPressed: () => _startYouTubeDownload(video, v, "mp4"),
                              );
                            }).toList(),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            void _openDirectDownloadSheet(String platform, String directUrl) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Container(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text("$platform Media Detected",
                            style: const TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 16)),
                        const SizedBox(height: 6),
                        const Text("Clean stream without watermark ready.",
                            style: TextStyle(color: Colors.white70, fontSize: 13)),
                        const SizedBox(height: 18),
                        Row(
                          children: [
                            Expanded(
                              child: ElevatedButton.icon(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFF59E0B),
                                  foregroundColor: Colors.black,
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                ),
                                onPressed: () => _downloadDirectFile(directUrl, platform, "mp4"),
                                icon: const Icon(Icons.video_collection),
                                label: const Text("Download MP4 (HD)", style: TextStyle(fontWeight: FontWeight.bold)),
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: ElevatedButton.icon(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF334155),
                                  foregroundColor: Colors.white,
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                ),
                                onPressed: () => _downloadDirectFile(directUrl, platform, "mp3"),
                                icon: const Icon(Icons.audiotrack),
                                label: const Text("Audio MP3", style: TextStyle(fontWeight: FontWeight.bold)),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 10),
                      ],
                    ),
                  );
                },
              );
            }

            Future<void> _updateEngine() async {
              setState(() {
                _isLoading = true;
                _statusText = "Syncing cloud bypass engines & signatures...";
              });

              await Future.delayed(const Duration(seconds: 2));

              setState(() {
                _isLoading = false;
                _statusText = "Engines 100% Up to Date!";
              });

              _showSnack("Core Database Synced! Lifetime bypass ready.");
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _yt.close();
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 0,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Text("4everTube 2027 Pro", style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 18)),
                      Text("dev by 4ever technology", style: TextStyle(color: Colors.white54, fontSize: 11)),
                    ],
                  ),
                  actions: [
                    IconButton(
                      tooltip: "Update Bypass Core",
                      icon: const Icon(Icons.sync, color: Color(0xFF10B981)),
                      onPressed: _updateEngine,
                    ),
                    IconButton(
                      tooltip: "Helpline",
                      icon: const Icon(Icons.call, color: Color(0xFFF59E0B)),
                      onPressed: () => launchUrl(Uri.parse("tel:03133796625")),
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1E293B),
                          borderRadius: BorderRadius.circular(10),
                          border: Border.all(color: Colors.white12),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceAround,
                          children: const [
                            Text("🔴 YouTube", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                            Text("🟣 Insta Reels", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                            Text("🔵 FB Watch", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                            Text("⚫ TikTok", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 16),

                      TextField(
                        controller: _urlController,
                        style: const TextStyle(color: Colors.white),
                        decoration: InputDecoration(
                          filled: true,
                          fillColor: const Color(0xFF1E293B),
                          hintText: "Link paste karein ya kisi bhi app se 'Share' karein...",
                          hintStyle: const TextStyle(color: Colors.white38, fontSize: 12),
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.clear, color: Colors.white38),
                            onPressed: () => _urlController.clear(),
                          ),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                        ),
                      ),
                      const SizedBox(height: 12),

                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFFF59E0B),
                            foregroundColor: Colors.black,
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                          ),
                          onPressed: _isLoading ? null : () => _fetchMedia(),
                          icon: const Icon(Icons.download),
                          label: Text(_isLoading ? "Processing Link..." : "Download Video / MP3",
                              style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        ),
                      ),
                      const SizedBox(height: 25),

                      if (_downloadProgress > 0.0) ...[
                        LinearProgressIndicator(value: _downloadProgress, color: const Color(0xFFF59E0B), backgroundColor: Colors.white12),
                        const SizedBox(height: 10),
                      ],

                      Text(_statusText, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70, fontSize: 13)),

                      const Spacer(),

                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1E293B),
                          borderRadius: BorderRadius.circular(12),
                          border: Border.all(color: Colors.white12),
                        ),
                        child: Row(
                          children: const [
                            Icon(Icons.share, color: Color(0xFFF59E0B), size: 28),
                            SizedBox(width: 10),
                            Expanded(
                              child: Text(
                                "Direct Share Active: YouTube, Insta, FB ya TikTok par 'Share' daba kar '4everTube 2027' select karein, download seedha shuru ho jayega!",
                                style: TextStyle(color: Colors.white70, fontSize: 11),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 12),

                      const Text("Official App • 4ever technology", style: TextStyle(color: Colors.white38, fontSize: 12)),
                      const SizedBox(height: 4),
                      GestureDetector(
                        onTap: () => launchUrl(Uri.parse("tel:03133796625")),
                        child: const Text("Helpline: 03133796625",
                            style: TextStyle(color: Color(0xFFF59E0B), fontSize: 14, fontWeight: FontWeight.bold)),
                      ),
                      const SizedBox(height: 8),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.technology4ever.forevertube2027">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application
                  android:label="4everTube 2027"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4everTube_2027_Release_APK
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
