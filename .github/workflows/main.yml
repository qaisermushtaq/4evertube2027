name: Build 4everTube 2027 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate & Build 4everTube 2027 Clean Build
        run: |
          flutter create --org com.technology4ever --project-name forevertube2027 --platforms=android app_project
          cd app_project
          flutter pub add youtube_explode_dart:^2.5.3 http:^1.2.2 path_provider:^2.1.4 permission_handler:^11.3.1 url_launcher:^6.3.1 open_filex:^4.5.0 shared_preferences:^2.3.2
          
          # Native Android Kotlin MainActivity with Share Intent
          cat << 'EOF' > android/app/src/main/kotlin/com/technology4ever/forevertube2027/MainActivity.kt
          package com.technology4ever.forevertube2027

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.content.Intent

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.technology4ever.forevertube2027/share"
              private var sharedData: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)

                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                  if (call.method == "getSharedData") {
                    result.success(sharedData)
                    sharedData = null
                  } else {
                    result.notImplemented()
                  }
                }
              }

              override fun onNewIntent(intent: Intent) {
                super.onNewIntent(intent)
                handleSendIntent(intent)
              }

              override fun onResume() {
                super.onResume()
                handleSendIntent(intent)
              }

              private fun handleSendIntent(intent: Intent?) {
                if (intent?.action == Intent.ACTION_SEND && intent.type == "text/plain") {
                  sharedData = intent.getStringExtra(Intent.EXTRA_TEXT)
                }
              }
          }
          EOF

          # Android Manifest
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.technology4ever.forevertube2027">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="4everTube 2027"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # Error-Free Clean Flutter Code
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http_pkg;
          import 'package:open_filex/open_filex.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: ForeverTubeMasterApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class DownloadItem {
            final String id;
            final String videoId;
            final String title;
            final String thumbnail;
            final String quality;
            final String filePath;
            final int totalBytes;
            final bool isAudio;
            final String? directStreamUrl;

            double progress = 0.0;
            String speed = "Connecting...";
            String eta = "--";
            String sizeInfo = "0 MB";
            bool isPaused = false;
            bool isCancelled = false;
            bool isCompleted = false;
            bool hasError = false;

            DownloadItem({
              required this.id,
              required this.videoId,
              required this.title,
              required this.thumbnail,
              required this.quality,
              required this.filePath,
              required this.totalBytes,
              required this.isAudio,
              this.directStreamUrl,
              this.progress = 0.0,
              this.isCompleted = false,
            });

            Map<String, dynamic> toJson() => {
              'id': id,
              'videoId': videoId,
              'title': title,
              'thumbnail': thumbnail,
              'quality': quality,
              'filePath': filePath,
              'totalBytes': totalBytes,
              'isAudio': isAudio,
              'directStreamUrl': directStreamUrl,
              'progress': progress,
              'isCompleted': isCompleted,
            };

            factory DownloadItem.fromJson(Map<String, dynamic> json) => DownloadItem(
              id: json['id'],
              videoId: json['videoId'],
              title: json['title'],
              thumbnail: json['thumbnail'],
              quality: json['quality'],
              filePath: json['filePath'],
              totalBytes: json['totalBytes'] ?? 0,
              isAudio: json['isAudio'] ?? false,
              directStreamUrl: json['directStreamUrl'],
              progress: (json['progress'] ?? 0.0).toDouble(),
              isCompleted: json['isCompleted'] ?? false,
            );
          }

          class ForeverTubeMasterApp extends StatefulWidget {
            const ForeverTubeMasterApp({super.key});

            @override
            State<ForeverTubeMasterApp> createState() => _ForeverTubeMasterAppState();
          }

          class _ForeverTubeMasterAppState extends State<ForeverTubeMasterApp> with SingleTickerProviderStateMixin, WidgetsBindingObserver {
            late TabController _tabController;
            final TextEditingController _urlController = TextEditingController();
            static const platformChannel = MethodChannel('com.technology4ever.forevertube2027/share');

            bool _isAnalyzing = false;
            final List<DownloadItem> _tasks = [];
            List<FileSystemEntity> _downloadedFiles = [];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _tabController = TabController(length: 2, vsync: this);
              _restoreTasks();
              _loadSavedFiles();
              _checkShareIntent();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _checkShareIntent();
                _loadSavedFiles();
              }
            }

            Future<void> _saveTasks() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final list = _tasks.map((t) => jsonEncode(t.toJson())).toList();
                await prefs.setStringList('saved_download_tasks', list);
              } catch (_) {}
            }

            Future<void> _restoreTasks() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final list = prefs.getStringList('saved_download_tasks');
                if (list != null && list.isNotEmpty) {
                  setState(() {
                    _tasks.clear();
                    for (var str in list) {
                      final item = DownloadItem.fromJson(jsonDecode(str));
                      if (File(item.filePath).existsSync() && item.isCompleted) {
                        _tasks.add(item);
                      } else if (!item.isCompleted) {
                        item.hasError = true;
                        item.speed = "Paused";
                        _tasks.add(item);
                      }
                    }
                  });
                }
              } catch (_) {}
            }

            Future<void> _checkShareIntent() async {
              try {
                final String? sharedData = await platformChannel.invokeMethod('getSharedData');
                if (sharedData != null && sharedData.isNotEmpty) {
                  String? extracted = _cleanLink(sharedData);
                  if (extracted != null && extracted.isNotEmpty) {
                    setState(() {
                      _urlController.text = extracted;
                      _tabController.animateTo(0);
                    });
                    _fastAnalyzeLink(extracted);
                  }
                }
              } catch (_) {}
            }

            Future<Directory?> _getDownloadFolder() async {
              if (Platform.isAndroid) {
                Directory dir = Directory('/storage/emulated/0/Download/4everTube');
                if (!await dir.exists()) {
                  await dir.create(recursive: true);
                }
                return dir;
              }
              return await getApplicationDocumentsDirectory();
            }

            Future<void> _loadSavedFiles() async {
              try {
                final dir = await _getDownloadFolder();
                if (dir != null && await dir.exists()) {
                  final files = dir.listSync().where((f) => !f.path.endsWith('.tmp') && !f.path.endsWith('.part')).toList();
                  files.sort((a, b) => b.statSync().modified.compareTo(a.statSync().modified));
                  setState(() {
                    _downloadedFiles = files;
                  });
                }
              } catch (_) {}
            }

            String? _cleanLink(String text) {
              RegExp exp = RegExp(r'(https?://[^\s]+)');
              Iterable<Match> matches = exp.allMatches(text);
              for (Match match in matches) {
                String u = text.substring(match.start, match.end);
                if (u.contains("?si=")) u = u.split("?si=")[0];
                if (u.contains("&si=")) u = u.split("&si=")[0];
                return u;
              }
              return text.contains("http") ? text.trim() : null;
            }

            Future<bool> _requestPermissions() async {
              if (Platform.isAndroid) {
                if (await Permission.manageExternalStorage.request().isGranted) return true;
                if (await Permission.storage.request().isGranted) return true;
                Map<Permission, PermissionStatus> statuses = await [
                  Permission.videos,
                  Permission.audio,
                ].request();
                return statuses.values.any((s) => s.isGranted);
              }
              return true;
            }

            void _quickFixAndReset() {
              for (var t in _tasks) {
                if (t.hasError || (!t.isCompleted && t.isPaused)) {
                  t.hasError = false;
                  t.isPaused = false;
                  _startPersistentStream(t);
                }
              }
              _loadSavedFiles();
              _showSnack("✅ Engine Reset! Pending tasks resumed.");
            }

            Future<void> _fastAnalyzeLink([String? directUrl]) async {
              final raw = directUrl ?? _urlController.text.trim();
              final url = _cleanLink(raw) ?? raw;

              if (url.isEmpty) {
                _showSnack("Pehle YouTube link paste karein!");
                return;
              }

              setState(() {
                _isAnalyzing = true;
              });

              final yt = YoutubeExplode();
              try {
                final video = await yt.videos.get(url).timeout(const Duration(seconds: 4));
                final manifest = await yt.videos.streamsClient.getManifest(video.id).timeout(const Duration(seconds: 5));

                setState(() {
                  _isAnalyzing = false;
                });
                yt.close();
                _showFormatPicker(video, manifest);
                return;
              } catch (_) {
                yt.close();
              }

              try {
                final res = await http_pkg.post(
                  Uri.parse("https://api.cobalt.tools/api/json"),
                  headers: {"Accept": "application/json", "Content-Type": "application/json"},
                  body: jsonEncode({"url": url, "vQuality": "max"}),
                ).timeout(const Duration(seconds: 6));

                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  final downloadUrl = data['url'];
                  if (downloadUrl != null) {
                    setState(() {
                      _isAnalyzing = false;
                    });
                    _showDirectMirrorSheet(url, downloadUrl);
                    return;
                  }
                }
              } catch (_) {}

              setState(() {
                _isAnalyzing = false;
              });
              _showSnack("Link analyze nahi ho saka. Dobara try karein.");
            }

            void _showFormatPicker(Video video, StreamManifest manifest) {
              final allVideos = manifest.video.sortByVideoQuality();
              final allAudio = manifest.audioOnly.sortByBitrate();

              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return Container(
                    height: MediaQuery.of(context).size.height * 0.82,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            ClipRRect(
                              borderRadius: BorderRadius.circular(8),
                              child: Image.network(
                                video.thumbnails.lowResUrl,
                                width: 85,
                                height: 58,
                                fit: BoxFit.cover,
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    video.title,
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                                  ),
                                  const SizedBox(height: 3),
                                  Text("${video.author} • ${video.duration?.inMinutes ?? 0}m",
                                      style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                ],
                              ),
                            ),
                          ],
                        ),
                        const Divider(color: Colors.white24, height: 24),
                        Expanded(
                          child: ListView(
                            children: [
                              const Text("🎬 Video Formats (4K / 1080p / 720p)",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 14)),
                              const SizedBox(height: 8),
                              ...allVideos.map((v) {
                                final quality = v.videoQualityLabel;
                                final mb = (v.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                String badge = quality.contains("2160") ? "4K Ultra HD" : quality.contains("1080") ? "FHD" : "HD";
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.flash_on, color: Color(0xFFF59E0B)),
                                    title: Text("$quality Video ($badge)", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • ${v.container.name.toUpperCase()}", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download, color: Color(0xFF10B981)),
                                    onTap: () {
                                      Navigator.pop(context);
                                      _urlController.clear();
                                      _queueNewTask(
                                        title: video.title,
                                        thumbnail: video.thumbnails.lowResUrl,
                                        totalBytes: v.size.totalBytes,
                                        quality: "Video ($quality)",
                                        ext: v.container.name,
                                        videoId: video.id.value,
                                        isAudio: false,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),
                              const SizedBox(height: 16),
                              const Text("🎵 MP3 Audio Formats",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 14)),
                              const SizedBox(height: 8),
                              ...allAudio.take(2).map((a) {
                                final kbps = a.bitrate.kiloBitsPerSecond.round();
                                final mb = (a.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.music_note, color: Color(0xFF10B981)),
                                    title: Text("$kbps kbps MP3 Audio", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • Audio Stream", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download, color: Color(0xFF10B981)),
                                    onTap: () {
                                      Navigator.pop(context);
                                      _urlController.clear();
                                      _queueNewTask(
                                        title: video.title,
                                        thumbnail: video.thumbnails.lowResUrl,
                                        totalBytes: a.size.totalBytes,
                                        quality: "MP3 ($kbps kbps)",
                                        ext: "mp3",
                                        videoId: video.id.value,
                                        isAudio: true,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            void _showDirectMirrorSheet(String originalUrl, String directUrl) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return Container(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text("⚡ High-Speed Turbo Stream Ready",
                            style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 16)),
                        const SizedBox(height: 6),
                        const Text("Cloud mirror decoders ne video successfully extract kar li hai.",
                            style: TextStyle(color: Colors.white70, fontSize: 13)),
                        const SizedBox(height: 18),
                        ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFFF59E0B),
                            foregroundColor: Colors.black,
                            minimumSize: const Size(double.infinity, 45),
                          ),
                          onPressed: () {
                            Navigator.pop(context);
                            _urlController.clear();
                            _queueDirectUrlTask(title: "YouTube Video (HD)", directUrl: directUrl);
                          },
                          icon: const Icon(Icons.download),
                          label: const Text("Download MP4 (Original HD)", style: TextStyle(fontWeight: FontWeight.bold)),
                        ),
                        const SizedBox(height: 10),
                      ],
                    ),
                  );
                },
              );
            }

            Future<void> _queueNewTask({
              required String title,
              required String thumbnail,
              required int totalBytes,
              required String quality,
              required String ext,
              required String videoId,
              required bool isAudio,
            }) async {
              await _requestPermissions();
              final dir = await _getDownloadFolder();
              if (dir == null) return;

              String safeTitle = title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
              if (safeTitle.length > 28) safeTitle = safeTitle.substring(0, 28);
              String fileName = "${safeTitle}_${DateTime.now().millisecondsSinceEpoch}.$ext";
              String fullPath = "${dir.path}/$fileName";

              final task = DownloadItem(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                videoId: videoId,
                title: title,
                thumbnail: thumbnail,
                quality: quality,
                filePath: fullPath,
                totalBytes: totalBytes,
                isAudio: isAudio,
              );

              setState(() {
                _tasks.insert(0, task);
              });
              _saveTasks();
              _startPersistentStream(task);
            }

            Future<void> _queueDirectUrlTask({required String title, required String directUrl}) async {
              await _requestPermissions();
              final dir = await _getDownloadFolder();
              if (dir == null) return;

              String fileName = "Video_${DateTime.now().millisecondsSinceEpoch}.mp4";
              String fullPath = "${dir.path}/$fileName";

              final task = DownloadItem(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                videoId: "",
                title: title,
                thumbnail: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
                quality: "Original HD",
                filePath: fullPath,
                totalBytes: 1024 * 1024 * 20,
                isAudio: false,
                directStreamUrl: directUrl,
              );

              setState(() {
                _tasks.insert(0, task);
              });
              _saveTasks();
              _startPersistentStream(task);
            }

            void _startPersistentStream(DownloadItem task) async {
              final file = File(task.filePath);
              final yt = YoutubeExplode();

              try {
                Stream<List<int>> stream;
                int total = task.totalBytes;

                if (task.directStreamUrl != null) {
                  final req = http_pkg.Request('GET', Uri.parse(task.directStreamUrl!));
                  final res = await http_pkg.Client().send(req);
                  stream = res.stream;
                  total = res.contentLength ?? task.totalBytes;
                } else {
                  final manifest = await yt.videos.streamsClient.getManifest(task.videoId);
                  StreamInfo? streamInfo;
                  if (task.isAudio) {
                    streamInfo = manifest.audioOnly.sortByBitrate().first;
                  } else {
                    streamInfo = manifest.video.sortByVideoQuality().firstWhere(
                      (s) => task.quality.contains(s.videoQualityLabel),
                      orElse: () => manifest.video.sortByVideoQuality().first,
                    );
                  }
                  stream = yt.videos.streamsClient.get(streamInfo);
                  total = streamInfo.size.totalBytes;
                }

                final output = file.openWrite(mode: FileMode.writeOnlyAppend);
                int received = file.existsSync() ? file.lengthSync() : 0;
                final stopwatch = Stopwatch()..start();
                int lastBytes = received;
                int lastTime = 0;

                await for (final chunk in stream) {
                  if (task.isCancelled) {
                    await output.close();
                    if (file.existsSync()) file.deleteSync();
                    setState(() {
                      _tasks.remove(task);
                    });
                    _saveTasks();
                    yt.close();
                    return;
                  }

                  while (task.isPaused) {
                    await Future.delayed(const Duration(milliseconds: 250));
                    if (task.isCancelled) break;
                  }

                  output.add(chunk);
                  received += chunk.length;

                  int elapsed = stopwatch.elapsedMilliseconds;
                  if (elapsed - lastTime >= 350) {
                    double speedBytesPerSec = ((received - lastBytes) / ((elapsed - lastTime) / 1000));
                    double speedMB = speedBytesPerSec / (1024 * 1024);
                    int remainingBytes = total > received ? (total - received) : 0;
                    int etaSec = speedBytesPerSec > 0 ? (remainingBytes / speedBytesPerSec).round() : 0;

                    setState(() {
                      task.progress = total > 0 ? (received / total) : 0.5;
                      task.sizeInfo = "${(received / (1024 * 1024)).toStringAsFixed(1)}MB / ${(total / (1024 * 1024)).toStringAsFixed(1)}MB";
                      task.speed = "${speedMB.toStringAsFixed(2)} MB/s";
                      task.eta = etaSec > 60 ? "${(etaSec / 60).toStringAsFixed(0)}m ${etaSec % 60}s" : "${etaSec}s";
                    });

                    lastBytes = received;
                    lastTime = elapsed;
                  }
                }

                await output.flush();
                await output.close();
                stopwatch.stop();

                setState(() {
                  task.isCompleted = true;
                  task.progress = 1.0;
                  task.speed = "Complete";
                  task.eta = "0s";
                });

                _saveTasks();
                _loadSavedFiles();
              } catch (e) {
                setState(() {
                  task.hasError = true;
                  task.speed = "Paused";
                });
                _saveTasks();
              } finally {
                yt.close();
              }
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg), duration: const Duration(seconds: 2)));
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _tabController.dispose();
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              int activeCount = _tasks.where((t) => !t.isCompleted && !t.hasError && !t.isPaused).length;

              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 0,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Text("4everTube 2027 Pro", style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 18)),
                      Text("Double-Layer Engine Active", style: TextStyle(color: Colors.white54, fontSize: 11)),
                    ],
                  ),
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: const Color(0xFFF59E0B),
                    tabs: [
                      Tab(
                        icon: Badge(
                          label: Text("$activeCount"),
                          isLabelVisible: activeCount > 0,
                          child: const Icon(Icons.flash_on),
                        ),
                        text: "Active Downloads",
