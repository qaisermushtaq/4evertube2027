                          const SizedBox(height: 8),
                          SizedBox(
                            width: double.infinity,
                            height: 45,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFF59E0B),
                                foregroundColor: Colors.black,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                              ),
                              onPressed: _isAnalyzing ? null : () => _fastAnalyzeLink(),
                              icon: const Icon(Icons.bolt),
                              label: Text(_isAnalyzing ? "Fast Decoding..." : "Instant Analyze Formats",
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                            ),
                          ),
                          const SizedBox(height: 12),

                          Expanded(
                            child: _tasks.isEmpty
                                ? const Center(
                                    child: Text("Koi active download nahi chal raha.\nYouTube se direct Share karein, popup khud khulega!",
                                        textAlign: TextAlign.center, style: TextStyle(color: Colors.white38, fontSize: 13)),
                                  )
                                : ListView.builder(
                                    itemCount: _tasks.length,
                                    itemBuilder: (context, index) {
                                      final t = _tasks[index];
                                      return Container(
                                        margin: const EdgeInsets.only(bottom: 10),
                                        padding: const EdgeInsets.all(12),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF1E293B),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: t.isCompleted ? const Color(0xFF10B981) : Colors.white12),
                                        ),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Row(
                                              children: [
                                                ClipRRect(
                                                  borderRadius: BorderRadius.circular(6),
                                                  child: Image.network(
                                                    t.thumbnail,
                                                    width: 60,
                                                    height: 45,
                                                    fit: BoxFit.cover,
                                                    errorBuilder: (c, e, s) => Container(width: 60, height: 45, color: Colors.black26, child: const Icon(Icons.movie, color: Colors.white38)),
                                                  ),
                                                ),
                                                const SizedBox(width: 10),
                                                Expanded(
                                                  child: Column(
                                                    crossAxisAlignment: CrossAxisAlignment.start,
                                                    children: [
                                                      Text(t.title, maxLines: 1, overflow: TextOverflow.ellipsis,
                                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)),
                                                      const SizedBox(height: 3),
                                                      Text("${t.quality} • ${t.sizeInfo}",
                                                          style: const TextStyle(color: Colors.white60, fontSize: 11)),
                                                    ],
                                                  ),
                                                ),
                                              ],
                                            ),
                                            const SizedBox(height: 8),
                                            LinearProgressIndicator(
                                              value: t.progress,
                                              color: t.isCompleted ? const Color(0xFF10B981) : (t.hasError ? Colors.amber : const Color(0xFFF59E0B)),
                                              backgroundColor: Colors.white12,
                                              minHeight: 6,
                                            ),
                                            const SizedBox(height: 6),
                                            Row(
                                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                              children: [
                                                Text(
                                                  t.isCompleted
                                                      ? "Complete"
                                                      : (t.hasError ? "Connection Dropped (Tap Resume)" : "${(t.progress * 100).toStringAsFixed(1)}% (${t.speed})"),
                                                  style: TextStyle(
                                                    color: t.isCompleted ? const Color(0xFF10B981) : (t.hasError ? Colors.amber : const Color(0xFFF59E0B)),
                                                    fontSize: 11,
                                                    fontWeight: FontWeight.bold,
                                                  ),
                                                ),
                                                Text(t.isCompleted ? "Saved" : "${t.eta} left",
                                                    style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                              ],
