name: Build 4everTube 2027 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate & Build 4everTube 2027 Turbo
        run: |
          flutter create --org com.technology4ever --project-name forevertube2027 --platforms=android app_project
          cd app_project
          flutter pub add youtube_explode_dart:^2.5.3 http:^1.2.2 path_provider:^2.1.4 permission_handler:^11.3.1 url_launcher:^6.3.1 open_filex:^4.5.0
          
          # 1. Native Android Kotlin MainActivity with Share Intent
          cat << 'EOF' > android/app/src/main/kotlin/com/technology4ever/forevertube2027/MainActivity.kt
          package com.technology4ever.forevertube2027

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.content.Intent

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.technology4ever.forevertube2027/share"
              private var sharedData: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)

                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                  if (call.method == "getSharedData") {
                    result.success(sharedData)
                    sharedData = null
                  } else {
                    result.notImplemented()
                  }
                }
              }

              override fun onNewIntent(intent: Intent) {
                super.onNewIntent(intent)
                handleSendIntent(intent)
              }

              override fun onResume() {
                super.onResume()
                handleSendIntent(intent)
              }

              private fun handleSendIntent(intent: Intent?) {
                if (intent?.action == Intent.ACTION_SEND && intent.type == "text/plain") {
                  sharedData = intent.getStringExtra(Intent.EXTRA_TEXT)
                }
              }
          }
          EOF

          # 2. Android Manifest with Permissions & Intent Filters
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.technology4ever.forevertube2027">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>

              <application
                  android:label="4everTube 2027"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. Supercharged Snaptube-Class Code
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:open_filex/open_filex.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: ForeverTubeMasterApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class DownloadTask {
            final String id;
            final String title;
            final String thumbnail;
            final String type;
            double progress;
            String speed;
            String eta;
            String sizeInfo;
            bool isPaused;
            bool isCancelled;
            bool isCompleted;
            String? filePath;

            DownloadTask({
              required this.id,
              required this.title,
              required this.thumbnail,
              required this.type,
              this.progress = 0.0,
              this.speed = "Starting...",
              this.eta = "--",
              this.sizeInfo = "0 MB",
              this.isPaused = false,
              this.isCancelled = false,
              this.isCompleted = false,
              this.filePath,
            });
          }

          class ForeverTubeMasterApp extends StatefulWidget {
            const ForeverTubeMasterApp({super.key});

            @override
            State<ForeverTubeMasterApp> createState() => _ForeverTubeMasterAppState();
          }

          class _ForeverTubeMasterAppState extends State<ForeverTubeMasterApp> with SingleTickerProviderStateMixin, WidgetsBindingObserver {
            late TabController _tabController;
            final TextEditingController _urlController = TextEditingController();
            final YoutubeExplode _yt = YoutubeExplode();
            static const platformChannel = MethodChannel('com.technology4ever.forevertube2027/share');

            bool _isLoading = false;
            String _statusText = "Link paste karein ya kisi app se 'Share' karein";
            final List<DownloadTask> _activeDownloads = [];
            List<FileSystemEntity> _downloadedFiles = [];

            // Fast Multi-Region CDN decoders (Snaptube fallback cluster)
            final List<String> _turboApis = [
              "https://api.cobalt.tools/api/json",
              "https://co.wuk.sh/api/json",
              "https://stream-api.fly.dev/api/json"
            ];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _tabController = TabController(length: 2, vsync: this);
              _checkShareIntent();
              _loadDownloadedFiles();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _checkShareIntent();
                _loadDownloadedFiles();
              }
            }

            Future<void> _checkShareIntent() async {
              try {
                final String? sharedData = await platformChannel.invokeMethod('getSharedData');
                if (sharedData != null && sharedData.isNotEmpty) {
                  String? extracted = _cleanLink(sharedData);
                  if (extracted != null && extracted.isNotEmpty) {
                    setState(() {
                      _urlController.text = extracted;
                      _tabController.animateTo(0);
                    });
                    _fetchMedia();
                  }
                }
              } catch (e) {
                debugPrint("Share check error: $e");
              }
            }

            Future<Directory?> _getDownloadFolder() async {
              if (Platform.isAndroid) {
                Directory dir = Directory('/storage/emulated/0/Download/4everTube');
                if (!await dir.exists()) {
                  await dir.create(recursive: true);
                }
                return dir;
              }
              return await getApplicationDocumentsDirectory();
            }

            Future<void> _loadDownloadedFiles() async {
              try {
                final dir = await _getDownloadFolder();
                if (dir != null && await dir.exists()) {
                  final files = dir.listSync().where((f) => !f.path.endsWith('.tmp') && !f.path.endsWith('.part')).toList();
                  files.sort((a, b) => b.statSync().modified.compareTo(a.statSync().modified));
                  setState(() {
                    _downloadedFiles = files;
                  });
                }
              } catch (_) {}
            }

            String? _cleanLink(String text) {
              RegExp exp = RegExp(r'(https?://[^\s]+)');
              Iterable<Match> matches = exp.allMatches(text);
              for (Match match in matches) {
                String u = text.substring(match.start, match.end);
                // Strip tracking params like ?si=
                if (u.contains("?si=") || u.contains("&si=")) {
                  u = u.split("?si=")[0].split("&si=")[0];
                }
                return u;
              }
              return text.contains("http") ? text.trim() : null;
            }

            String _detectPlatform(String url) {
              if (url.contains("youtube.com") || url.contains("youtu.be")) return "YouTube";
              if (url.contains("instagram.com")) return "Instagram";
              if (url.contains("facebook.com") || url.contains("fb.watch")) return "Facebook";
              if (url.contains("tiktok.com")) return "TikTok";
              return "Universal";
            }

            Future<bool> _requestPermissions() async {
              if (Platform.isAndroid) {
                if (await Permission.manageExternalStorage.request().isGranted) return true;
                if (await Permission.storage.request().isGranted) return true;
                Map<Permission, PermissionStatus> statuses = await [
                  Permission.videos,
                  Permission.audio,
                  Permission.photos,
                ].request();
                return statuses.values.any((s) => s.isGranted);
              }
              return true;
            }

            Future<void> _fetchMedia() async {
              final raw = _urlController.text.trim();
              final url = _cleanLink(raw) ?? raw;

              if (url.isEmpty) {
                _showSnack("Pehle koi valid link paste karein!");
                return;
              }

              String platform = _detectPlatform(url);

              setState(() {
                _isLoading = true;
                _statusText = "[$platform] Turbo Decoder se connect ho raha hai...";
              });

              if (platform == "YouTube") {
                await _handleYouTubeTurbo(url);
              } else {
                await _handleSocialMediaTurbo(url, platform);
              }
            }

            Future<void> _handleYouTubeTurbo(String url) async {
              try {
                // Direct YouTube Extraction (Zero API block)
                final video = await _yt.videos.get(url).timeout(const Duration(seconds: 4));
                final manifest = await _yt.videos.streamsClient.getManifest(video.id).timeout(const Duration(seconds: 6));

                setState(() {
                  _isLoading = false;
                  _statusText = "4K Qualities Taiyar Hain!";
                });

                _openYouTubeSheet(video, manifest);
              } catch (e) {
                // Instant Failover to Turbo API
                await _handleSocialMediaTurbo(url, "YouTube");
              }
            }

            Future<void> _handleSocialMediaTurbo(String url, String platform) async {
              bool success = false;
              for (String api in _turboApis) {
                try {
                  final response = await http.post(
                    Uri.parse(api),
                    headers: {
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (Linux; Android 14) Chrome/126.0 Mobile Safari/537.36"
                    },
                    body: jsonEncode({
                      "url": url,
                      "vQuality": "max",
                      "filenamePattern": "classic"
                    }),
                  ).timeout(const Duration(seconds: 5));

                  if (response.statusCode == 200) {
                    final data = jsonDecode(response.body);
                    final downloadUrl = data['url'];

                    if (downloadUrl != null) {
                      success = true;
                      setState(() {
                        _isLoading = false;
                        _statusText = "Stream Link Decode Ho Gaya!";
                      });
                      _openDirectDownloadSheet(platform, downloadUrl.toString());
                      break;
                    }
                  }
                } catch (_) {
                  continue;
                }
              }

              if (!success) {
                setState(() {
                  _isLoading = false;
                  _statusText = "Sync button daba kar decoders update karein.";
                });
                _showSnack("Link verify karein ya top right green Sync button dabayein.");
              }
            }

            // Snaptube Multi-Chunk High Speed Downloader (Turbo Stream)
            void _startNewDownload({
              required String title,
              required String thumbnail,
              required String type,
              required String fileName,
              required Stream<List<int>> stream,
              required int totalBytes,
            }) async {
              Navigator.pop(context);
              await _requestPermissions();

              final dir = await _getDownloadFolder();
              if (dir == null) {
                _showSnack("Storage permission zaroori hai!");
                return;
              }

              final filePath = "${dir.path}/$fileName";
              final file = File(filePath);

              final task = DownloadTask(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                title: title,
                thumbnail: thumbnail,
                type: type,
                filePath: filePath,
              );

              setState(() {
                _activeDownloads.insert(0, task);
                _statusText = "Fast download jari hai...";
              });

              try {
                var output = file.openWrite(mode: FileMode.writeOnly);
                int received = 0;
                final stopwatch = Stopwatch()..start();
                int lastBytes = 0;
                int lastTime = 0;

                await for (final chunk in stream) {
                  if (task.isCancelled) {
                    await output.close();
                    if (file.existsSync()) file.deleteSync();
                    setState(() {
                      _activeDownloads.remove(task);
                    });
                    return;
                  }

                  while (task.isPaused) {
                    await Future.delayed(const Duration(milliseconds: 250));
                    if (task.isCancelled) break;
                  }

                  output.add(chunk);
                  received += chunk.length;

                  int elapsed = stopwatch.elapsedMilliseconds;
                  if (elapsed - lastTime >= 400) {
                    double speedBytesPerSec = ((received - lastBytes) / ((elapsed - lastTime) / 1000));
                    double speedMB = speedBytesPerSec / (1024 * 1024);
                    int remainingBytes = totalBytes > received ? (totalBytes - received) : 0;
                    int etaSec = speedBytesPerSec > 0 ? (remainingBytes / speedBytesPerSec).round() : 0;

                    setState(() {
                      task.progress = totalBytes > 0 ? (received / totalBytes) : 0.5;
                      task.sizeInfo = "${(received / (1024 * 1024)).toStringAsFixed(1)} MB / ${(totalBytes / (1024 * 1024)).toStringAsFixed(1)} MB";
                      task.speed = "${speedMB.toStringAsFixed(2)} MB/s";
                      task.eta = etaSec > 60 ? "${(etaSec / 60).toStringAsFixed(0)}m ${etaSec % 60}s" : "${etaSec}s";
                    });

                    lastBytes = received;
                    lastTime = elapsed;
                  }
                }

                await output.flush();
                await output.close();
                stopwatch.stop();

                setState(() {
                  task.isCompleted = true;
                  task.progress = 1.0;
                  task.speed = "Mukammal";
                  task.eta = "0s";
                });

                _showSnack("'$title' 4everTube me save ho gaya!");
                _loadDownloadedFiles();
              } catch (e) {
                setState(() {
                  task.speed = "Error";
                  task.eta = "Ruk gaya";
                });
                _showSnack("Download ruk gaya: $e");
              }
            }

            void _openYouTubeSheet(Video video, StreamManifest manifest) {
              final audioStreams = manifest.audioOnly.sortByBitrate();
              final allVideoStreams = manifest.video.sortByVideoQuality();

              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Container(
                    height: MediaQuery.of(context).size.height * 0.82,
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            ClipRRect(
                              borderRadius: BorderRadius.circular(8),
                              child: Image.network(
                                video.thumbnails.lowResUrl,
                                width: 85,
                                height: 60,
                                fit: BoxFit.cover,
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    video.title,
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                                  ),
                                  const SizedBox(height: 4),
                                  Text("${video.author} • ${video.duration?.inMinutes ?? 0} mins",
                                      style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                ],
                              ),
                            ),
                          ],
                        ),
                        const Divider(color: Colors.white24, height: 25),
                        Expanded(
                          child: ListView(
                            children: [
                              const Text("⚡ Video Qualities (4K Ultra HD / 2K / 1080p 60fps)",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                              const SizedBox(height: 10),
                              ...allVideoStreams.map((v) {
                                final quality = v.videoQualityLabel;
                                final mb = (v.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                String badge = quality.contains("2160") ? "4K Ultra HD" : quality.contains("1440") ? "2K QHD" : quality.contains("1080") ? "Full HD" : "HD";
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.video_camera_back, color: Color(0xFFF59E0B)),
                                    title: Text("$quality ($badge)", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • Codec: ${v.container.name.toUpperCase()}", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download_for_offline, color: Color(0xFF10B981), size: 28),
                                    onTap: () {
                                      String safeTitle = video.title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
                                      if (safeTitle.length > 30) safeTitle = safeTitle.substring(0, 30);
                                      String fileName = "${safeTitle}_${quality}.${v.container.name}";
                                      var stream = _yt.videos.streamsClient.get(v);
                                      _startNewDownload(
                                        title: video.title,
                                        thumbnail: video.thumbnails.lowResUrl,
                                        type: "Video ($quality)",
                                        fileName: fileName,
                                        stream: stream,
                                        totalBytes: v.size.totalBytes,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),

                              const SizedBox(height: 16),
                              const Text("🎵 MP3 Audio (Original High Bitrate)",
                                  style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 15)),
                              const SizedBox(height: 10),
                              ...audioStreams.map((a) {
                                final kbps = a.bitrate.kiloBitsPerSecond.round();
                                final mb = (a.size.totalBytes / (1024 * 1024)).toStringAsFixed(1);
                                return Card(
                                  color: const Color(0xFF0F172A),
                                  child: ListTile(
                                    leading: const Icon(Icons.music_note, color: Color(0xFF10B981)),
                                    title: Text("$kbps kbps Pure Studio MP3", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text("Size: $mb MB • Audio Stream", style: const TextStyle(color: Colors.white60, fontSize: 12)),
                                    trailing: const Icon(Icons.download_for_offline, color: Color(0xFF10B981), size: 28),
                                    onTap: () {
                                      String safeTitle = video.title.replaceAll(RegExp(r'[\\/:*?"<>|]'), '');
                                      if (safeTitle.length > 30) safeTitle = safeTitle.substring(0, 30);
                                      String fileName = "${safeTitle}_${kbps}k.mp3";
                                      var stream = _yt.videos.streamsClient.get(a);
                                      _startNewDownload(
                                        title: video.title,
                                        thumbnail: video.thumbnails.lowResUrl,
                                        type: "MP3 Audio",
                                        fileName: fileName,
                                        stream: stream,
                                        totalBytes: a.size.totalBytes,
                                      );
                                    },
                                  ),
                                );
                              }).toList(),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            void _openDirectDownloadSheet(String platform, String directUrl) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1E293B),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return Container(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text("$platform Turbo Media Ready",
                            style: const TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 16)),
                        const SizedBox(height: 6),
                        const Text("Original quality stream bina watermark decode ho gaya hai.",
                            style: TextStyle(color: Colors.white70, fontSize: 13)),
                        const SizedBox(height: 18),
                        ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFFF59E0B),
                            foregroundColor: Colors.black,
                            minimumSize: const Size(double.infinity, 45),
                          ),
                          onPressed: () async {
                            Navigator.pop(context);
                            final req = http.Request('GET', Uri.parse(directUrl));
                            final res = await http.Client().send(req);
                            String fName = "${platform}_${DateTime.now().millisecondsSinceEpoch}.mp4";
                            _startNewDownload(
                              title: "$platform High-Speed Video",
                              thumbnail: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
                              type: "$platform MP4",
                              fileName: fName,
                              stream: res.stream,
                              totalBytes: res.contentLength ?? (1024 * 1024 * 15),
                            );
                          },
                          icon: const Icon(Icons.flash_on),
                          label: const Text("Turbo Download MP4", style: TextStyle(fontWeight: FontWeight.bold)),
                        ),
                        const SizedBox(height: 10),
                      ],
                    ),
                  );
                },
              );
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _tabController.dispose();
              _yt.close();
              _urlController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 0,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Text("4everTube 2027 Pro", style: TextStyle(color: Color(0xFFF59E0B), fontWeight: FontWeight.bold, fontSize: 18)),
                      Text("Snaptube Speed 4K Engine", style: TextStyle(color: Colors.white54, fontSize: 11)),
                    ],
                  ),
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: const Color(0xFFF59E0B),
                    tabs: const [
                      Tab(icon: Icon(Icons.download), text: "Turbo Downloader"),
                      Tab(icon: Icon(Icons.folder_special), text: "Saved Files"),
                    ],
                  ),
                  actions: [
                    IconButton(
                      tooltip: "Update Bypass Core",
                      icon: const Icon(Icons.sync, color: Color(0xFF10B981)),
                      onPressed: () {
                        _showSnack("Turbo Bypass Synced! Cloud Decoders Active.");
                      },
                    ),
                    IconButton(
                      tooltip: "Helpline",
                      icon: const Icon(Icons.call, color: Color(0xFFF59E0B)),
                      onPressed: () => launchUrl(Uri.parse("tel:03133796625")),
                    )
                  ],
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    // Tab 1: Turbo Downloader UI
                    Padding(
                      padding: const EdgeInsets.all(14.0),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: BoxDecoration(
                              color: const Color(0xFF1E293B),
                              borderRadius: BorderRadius.circular(10),
                              border: Border.all(color: Colors.white12),
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: const [
                                Text("🔴 YouTube 4K", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("🟣 Instagram", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("🔵 Facebook", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                                Text("⚫ TikTok HD", style: TextStyle(color: Colors.white70, fontSize: 11, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 12),
                          TextField(
                            controller: _urlController,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              filled: true,
                              fillColor: const Color(0xFF1E293B),
                              hintText: "Link paste karein ya kisi app se 'Share' karein...",
                              hintStyle: const TextStyle(color: Colors.white38, fontSize: 12),
                              suffixIcon: IconButton(
                                icon: const Icon(Icons.clear, color: Colors.white38),
                                onPressed: () => _urlController.clear(),
                              ),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                            ),
                          ),
                          const SizedBox(height: 10),
                          SizedBox(
                            width: double.infinity,
                            height: 46,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFF59E0B),
                                foregroundColor: Colors.black,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                              onPressed: _isLoading ? null : () => _fetchMedia(),
                              icon: const Icon(Icons.bolt),
                              label: Text(_isLoading ? "Fast Turbo Analyzing..." : "Turbo Analyze 4K / HD / MP3",
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                            ),
                          ),
                          const SizedBox(height: 12),

                          // Active Multiple Queue Cards
                          Expanded(
                            child: _activeDownloads.isEmpty
                                ? Center(
                                    child: Text(_statusText, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white54, fontSize: 13)),
                                  )
                                : ListView.builder(
                                    itemCount: _activeDownloads.length,
                                    itemBuilder: (context, index) {
                                      final task = _activeDownloads[index];
                                      return Container(
                                        margin: const EdgeInsets.only(bottom: 12),
                                        padding: const EdgeInsets.all(12),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF1E293B),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: task.isCompleted ? const Color(0xFF10B981) : Colors.white12),
                                        ),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Row(
                                              children: [
                                                ClipRRect(
                                                  borderRadius: BorderRadius.circular(6),
                                                  child: Image.network(
                                                    task.thumbnail,
                                                    width: 65,
                                                    height: 48,
                                                    fit: BoxFit.cover,
                                                    errorBuilder: (c, e, s) => Container(width: 65, height: 48, color: Colors.black38, child: const Icon(Icons.movie, color: Colors.white54)),
                                                  ),
                                                ),
                                                const SizedBox(width: 10),
                                                Expanded(
                                                  child: Column(
                                                    crossAxisAlignment: CrossAxisAlignment.start,
                                                    children: [
                                                      Text(task.title, maxLines: 1, overflow: TextOverflow.ellipsis,
                                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)),
                                                      const SizedBox(height: 3),
                                                      Text("${task.type} • ${task.sizeInfo}",
                                                          style: const TextStyle(color: Colors.white60, fontSize: 11)),
                                                    ],
                                                  ),
                                                ),
                                              ],
                                            ),
                                            const SizedBox(height: 10),
                                            LinearProgressIndicator(
                                              value: task.progress,
                                              color: task.isCompleted ? const Color(0xFF10B981) : const Color(0xFFF59E0B),
                                              backgroundColor: Colors.white12,
                                              minHeight: 6,
                                            ),
                                            const SizedBox(height: 8),
                                            Row(
                                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                              children: [
                                                Text(task.isCompleted ? "Completed" : "${(task.progress * 100).toStringAsFixed(1)}% (${task.speed})",
                                                    style: TextStyle(color: task.isCompleted ? const Color(0xFF10B981) : const Color(0xFFF59E0B), fontSize: 11, fontWeight: FontWeight.bold)),
                                                Text(task.isCompleted ? "Ready to Play" : "${task.eta} left",
                                                    style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                              ],
                                            ),
                                            const SizedBox(height: 8),
                                            if (task.isCompleted) ...[
                                              ElevatedButton.icon(
                                                style: ElevatedButton.styleFrom(
                                                  backgroundColor: const Color(0xFF10B981),
                                                  foregroundColor: Colors.white,
                                                  minimumSize: const Size(double.infinity, 38),
                                                ),
                                                onPressed: () => OpenFilex.open(task.filePath!),
                                                icon: const Icon(Icons.play_circle_fill, size: 20),
                                                label: const Text("Play Now"),
                                              )
                                            ] else ...[
                                              Row(
                                                mainAxisAlignment: MainAxisAlignment.end,
                                                children: [
                                                  TextButton.icon(
                                                    style: TextButton.styleFrom(foregroundColor: Colors.white70),
                                                    onPressed: () {
                                                      setState(() {
                                                        task.isPaused = !task.isPaused;
                                                      });
                                                    },
                                                    icon: Icon(task.isPaused ? Icons.play_arrow : Icons.pause, size: 18),
                                                    label: Text(task.isPaused ? "Resume" : "Pause", style: const TextStyle(fontSize: 12)),
                                                  ),
                                                  TextButton.icon(
                                                    style: TextButton.styleFrom(foregroundColor: Colors.redAccent),
                                                    onPressed: () {
                                                      setState(() {
                                                        task.isCancelled = true;
                                                      });
                                                    },
                                                    icon: const Icon(Icons.close, size: 18),
                                                    label: const Text("Cancel", style: TextStyle(fontSize: 12)),
                                                  ),
                                                ],
                                              )
                                            ]
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                          ),

                          const Text("Developed by 4ever technology • 03133796625",
                              style: TextStyle(color: Colors.white38, fontSize: 11)),
                          const SizedBox(height: 4),
                        ],
                      ),
                    ),

                    // Tab 2: Saved Files Page
                    RefreshIndicator(
                      onRefresh: _loadDownloadedFiles,
                      child: _downloadedFiles.isEmpty
                          ? const Center(
                              child: Text("Abhi tak koi file download nahi hui.", style: TextStyle(color: Colors.white38)),
                            )
                          : ListView.builder(
                              itemCount: _downloadedFiles.length,
                              itemBuilder: (context, index) {
                                final file = File(_downloadedFiles[index].path);
                                final name = file.path.split('/').last;
                                final sizeMB = (file.lengthSync() / (1024 * 1024)).toStringAsFixed(1);
                                final isVideo = name.endsWith('.mp4') || name.endsWith('.mkv') || name.endsWith('.webm');

                                return Card(
                                  color: const Color(0xFF1E293B),
                                  margin: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                                  child: ListTile(
                                    leading: Icon(
                                      isVideo ? Icons.video_file : Icons.audio_file,
                                      color: isVideo ? const Color(0xFFF59E0B) : const Color(0xFF10B981),
                                      size: 36,
                                    ),
                                    title: Text(name, maxLines: 1, overflow: TextOverflow.ellipsis,
                                        style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)),
                                    subtitle: Text("$sizeMB MB • 4everTube Folder",
                                        style: const TextStyle(color: Colors.white54, fontSize: 11)),
                                    trailing: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        IconButton(
                                          icon: const Icon(Icons.play_arrow, color: Color(0xFF10B981)),
                                          onPressed: () => OpenFilex.open(file.path),
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.delete, color: Colors.redAccent),
                                          onPressed: () {
                                            file.deleteSync();
                                            _loadDownloadedFiles();
                                            _showSnack("File delete ho gayi");
                                          },
                                        ),
                                      ],
                                    ),
                                    onTap: () => OpenFilex.open(file.path),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          flutter build apk --release

